<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patriva — Sign In (Redesign v2)</title>
<meta name="viewport" content="width=390">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #10152b;
    --navy-2: #1b2247;
    --cream: #f7f2e8;
    --white: #ffffff;
    --gold: #c69a5b;
    --gold-dark: #b3854a;
    --text-dark: #1c1e2a;
    --text-muted: #948d7d;
    --border: #e6e0d2;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:#dcdcdc;
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  .frame-label{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    font-family:'Inter',sans-serif; font-size:12px; color:#555; letter-spacing:.04em;
  }
  .screen{
    width:390px; height:844px;
    background:var(--cream);
    position:relative;
    overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.28);
    display:flex; flex-direction:column;
  }

  /* ---------- HERO ---------- */
  .hero{
    background:linear-gradient(160deg,var(--navy),var(--navy-2));
    padding:56px 28px 34px;
    position:relative;
    overflow:hidden;
    flex-shrink:0;
  }
  .hero .arch-deco{
    position:absolute;
    width:260px; height:260px;
    right:-70px; bottom:-90px;
    background:var(--gold);
    opacity:.08;
    border-radius:50% 50% 0 0;
  }
  .hero .arch-deco.small{
    width:130px; height:130px;
    right:40px; bottom:-40px;
    opacity:.06;
  }
  .logo-row{
    display:flex; align-items:center; gap:9px;
    position:relative; z-index:1;
  }
  .logo-mark{
    width:20px; height:20px;
    background:var(--gold);
    border-radius:50% 50% 0 0;
    display:inline-block;
  }
  .logo-word{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:21px;
    color:var(--white);
    letter-spacing:.01em;
  }
  .eyebrow{
    position:relative; z-index:1;
    margin-top:22px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.14em;
    color:var(--gold);
    text-transform:uppercase;
  }
  .headline{
    position:relative; z-index:1;
    font-family:'Playfair Display',serif;
    font-weight:600;
    font-size:38px;
    line-height:1.12;
    color:var(--white);
    margin-top:10px;
  }
  .subhead{
    position:relative; z-index:1;
    margin-top:10px;
    font-size:14px;
    line-height:1.5;
    color:#c9cadd;
    max-width:280px;
  }

  /* ---------- BODY ---------- */
  .body{
    flex:1;
    padding:26px 24px 28px;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  .social-row{
    display:flex; gap:12px;
    margin-top:16px;
  }
  .social-square{
    flex:1;
    aspect-ratio:1 / 1;
    display:flex; align-items:center; justify-content:center;
    background:var(--white);
    border:1px solid var(--border);
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(20,20,30,.04);
    transition:box-shadow .15s ease, border-color .15s ease, transform .1s ease;
  }
  .social-square:hover{ border-color:#d8d0bd; box-shadow:0 4px 12px rgba(20,20,30,.08); }
  .social-square:active{ transform:scale(.97); }
  .social-square svg{ width:22px; height:22px; }

  .divider{
    display:flex; align-items:center; gap:12px;
    margin:22px 0 20px;
  }
  .divider::before,.divider::after{
    content:""; flex:1; height:1px; background:var(--border);
  }
  .divider span{
    font-size:10.5px; font-weight:600; letter-spacing:.12em;
    color:var(--text-muted); text-transform:uppercase; white-space:nowrap;
  }

  .field{ margin-bottom:16px; }
  .field-label-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:7px;
  }
  label.field-label{
    font-size:11px; font-weight:600; letter-spacing:.09em;
    color:var(--text-muted); text-transform:uppercase;
  }
  a.forgot{
    font-size:12.5px; font-weight:600; color:var(--gold-dark); text-decoration:none;
  }
  .input-wrap{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border);
    background:var(--white);
    border-radius:12px;
    padding:13px 14px;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .input-wrap:focus-within{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(198,154,91,.15);
  }
  .input-wrap svg{ width:18px; height:18px; color:var(--text-muted); flex-shrink:0; }
  .input-wrap input{
    border:none; outline:none; flex:1;
    font-family:'Inter',sans-serif;
    font-size:14.5px; color:var(--text-dark);
    background:transparent;
  }
  .input-wrap input::placeholder{ color:#b3ac9c; }
  .input-wrap button.eye-btn{
    background:none; border:none; padding:0; cursor:pointer;
    color:var(--text-muted); display:flex;
  }

  .checkbox-row{
    display:flex; align-items:center; gap:10px;
    margin:6px 0 22px;
    font-size:13.5px; color:var(--text-dark);
    cursor:pointer;
    user-select:none;
  }
  .checkbox-row .box{
    width:18px; height:18px;
    border:1.6px solid #c9c1ac;
    border-radius:5px;
    flex-shrink:0;
    display:inline-block;
    background:var(--white);
  }
  .checkbox-row input{ display:none; }

  .cta{
    width:100%;
    background:linear-gradient(160deg,var(--gold),var(--gold-dark));
    border:none;
    border-radius:14px;
    padding:16px;
    color:var(--white);
    font-family:'Inter',sans-serif;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.01em;
    display:flex; align-items:center; justify-content:center; gap:8px;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(179,133,74,.35);
  }
  .cta svg{ width:18px; height:18px; }

  .trust-note{
    margin-top:16px;
    text-align:center;
    font-size:11.5px;
    color:var(--text-muted);
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .trust-note svg{ width:13px; height:13px; }

  .spacer{ flex:1; }
</style>
</head>
<body>
<div class="frame-label">Patriva · Sign In · Redesign v2 · 390 × 844</div>
<div class="screen">

  <div class="hero">
    <div class="arch-deco"></div>
    <div class="arch-deco small"></div>
    <div class="logo-row">
      <span class="logo-mark"></span>
      <span class="logo-word">Patriva</span>
    </div>
    <p class="eyebrow">One sign-in · All your products</p>
    <h1 class="headline">Welcome<br>back.</h1>
    <p class="subhead">Good to see you again — let's get back to what matters to your family.</p>
  </div>

  <div class="body">
    <div class="field">
      <div class="field-label-row"><label class="field-label">Email address</label></div>
      <div class="input-wrap">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input type="email" placeholder="you@example.com">
      </div>
    </div>

    <div class="field">
      <div class="field-label-row">
        <label class="field-label">Password</label>
        <a class="forgot" href="#">Forgot?</a>
      </div>
      <div class="input-wrap">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" placeholder="Enter your password">
        <button class="eye-btn" aria-label="Show password">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <label class="checkbox-row">
      <input type="checkbox">
      <span class="box"></span>
      Keep me signed in for 30 days
    </label>

    <button class="cta">
      Sign in
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></svg>
    </button>

    <div class="divider"><span>or continue with</span></div>

    <div class="social-row">
      <div class="social-square" role="button" aria-label="Continue with Google">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.5 29.6 4 24 4c-7.7 0-14.3 4.4-17.7 10.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.6l6.2 5.2C39.9 36.9 44 31 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
      </div>
      <div class="social-square" role="button" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24" fill="#111"><path d="M16.365 1.43c0 1.14-.462 2.243-1.17 3.05-.795.902-2.096 1.596-3.175 1.51-.13-1.11.44-2.28 1.16-3.05.8-.86 2.19-1.51 3.185-1.51zm4.14 16.62c-.6 1.37-.885 1.98-1.655 3.2-1.075 1.68-2.585 3.77-4.46 3.79-1.66.02-2.09-1.08-4.35-1.07-2.26.01-2.73 1.09-4.4 1.07-1.87-.02-3.3-1.9-4.38-3.58C.85 17.13.3 12.4 1.87 9.24c1.02-2.06 2.85-3.36 4.85-3.39 1.78-.03 3.45 1.2 4.35 1.2.9 0 2.9-1.48 4.9-1.26.83.04 3.17.34 4.67 2.53-.12.08-2.79 1.63-2.76 4.86.03 3.87 3.4 5.16 3.44 5.18z"/></svg>
      </div>
    </div>

    <p class="trust-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
